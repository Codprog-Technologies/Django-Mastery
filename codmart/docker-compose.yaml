name: codmart

services:
  api:
    container_name: codmart_api
    build:
      context: .
    image: codprog/codmart:new
    ports:
      - "80:8000"
    command: >
      sh -c "python codmart/manage.py migrate &&\
             python codmart/manage.py runserver 0.0.0.0:8000"
    env_file:
      - env.file
    restart: always
#    networks:
#      - custom_bridge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
    depends_on:
      db:
        condition: service_healthy


  db:
    container_name: db
    image: postgres:18.1
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
#    networks:
#      - custom_bridge
    ports:
      - 65432:5432

volumes:
  db_vol:

